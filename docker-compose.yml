
version: '3.2'

services:
    # ------------------
    # Nginx サービス (Webサーバー)
    # ------------------
    nginx:
        image: nginx:1.27.0
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./src:/var/www/
        depends_on:
            - php

    # ------------------
    # PHP サービス (アプリケーション実行環境)
    # ------------------
    php:
        build:
            context: ./docker/php
        volumes:
            - ./src:/var/www/
        # M1環境対応: ホストOSと同じユーザーIDを使用し、権限問題を回避
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            # プロンプト表示改善のため、ユーザー名を指定
            - USER=appuser

    # ------------------
    # MySQL サービス (データベース)
    # ------------------
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel_db
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: laravel_pass
        volumes:
            # データ永続化に名前付きボリュームを使用 (推奨)
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
        ports:
            - "3306:3306"

    # ------------------
    # phpMyAdmin サービス (DB管理ツール)
    # ------------------
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        environment:
            PMA_HOST: mysql
            PMA_USER: laravel_user
            PMA_PASSWORD: laravel_pass
        depends_on:
            - mysql
        ports:
            - 8080:80

# ------------------
# ボリューム定義 (データ永続化用)
# ------------------
volumes:
    mysql_data: